services:
  postgres:
    image: postgres:16-alpine
    container_name: kgm-torres-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: kgm
      POSTGRES_PASSWORD: kgm_secret
      POSTGRES_DB: kgm_torres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kgm -d kgm_torres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
